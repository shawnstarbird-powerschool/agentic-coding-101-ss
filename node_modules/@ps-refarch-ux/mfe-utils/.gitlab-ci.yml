# The PDS-Site CI/CD process is documented here: https://powerschoolgroup.atlassian.net/wiki/spaces/DevZone/pages/562856047/PDS+CI+CD
# Gitlab YML Help: https://gitlab.powerschool.com/help/ci/yaml/README

stages:
    - build
    - test
    - deploy #deploys this branch to artifactory

.buildjob:
  image: registry.gitlab.com/powerschoolgroup/unified-applications/unifiedhome/app-shell:latest

.npmrc: &npmrc
  - echo "logging in with ARTIFACTORY_AUTH_TOKEN"
  - touch ~/.npmrc
  - echo "always-auth=true" >>~/.npmrc
  - echo "registry=https://artifactory.powerschoolcorp.com/artifactory/api/npm/ps-npm/" >>~/.npmrc
  - echo "_authToken=$ARTIFACTORY_AUTH_TOKEN" >>~/.npmrc
  - echo "End of token:"
  - expr substr "$ARTIFACTORY_AUTH_TOKEN" 200 9999


.npm_install: &npm_install
  - if [[ ! -d "node_modules/@ps-refarch-ux" ]]; then
  - npm ci
  - fi
  - if [[ ! -d "cdk/node_modules/@ps-refarch" ]]; then
  - cd cdk && npm ci && cd ..
  - fi

Upload to Artifactory: #Job Name
    stage: deploy
    image: registry.gitlab.com/powerschoolgroup/unified-applications/unifiedhome/app-shell:latest
    script:
        - echo "Starting Deployment..."
        - node -v
        - npm -v
        - ls -l
        - npm config set registry=https://artifactory.powerschoolcorp.com/artifactory/api/npm/ps-refarch-ux-npm-local
        - npm config set always-auth=true
        - npm config set _authToken=$ARTIFACTORY_AUTH_TOKEN
        - echo $ARTIFACTORY_AUTH_TOKEN
        - echo "$ARTIFACTORY_AUTH_TOKEN"
        - npm publish
        - echo "Deployment Complete."
    rules:         # The default is for this to never run except on the master branch.
        - if: '$CI_COMMIT_REF_NAME == "master"'
          when: always
        - if: '$UPLOAD_TO_ARTIFACTORY == "TRUE"'
          when: always
        - when: never # Default

main-build:
  stage: build
  extends: .buildjob
  variables:
    PS_ENVIRONMENT: dev
  script:
    - *npmrc
    # Do npm install if node_modules was not found in cache
    - *npm_install
    - echo "run build and lint"; date
    - npm run build
    - echo 'end of build scripts'; date
  artifacts:
    name: build-results
    expire_in: 2 weeks
    paths:
      - node_modules/
      - components
      - package.json
      - package-lock.json
      - dist

unit-test:
  stage: test
  extends: .buildjob
  dependencies:
    - main-build
  script:
    - *npmrc
    # Do npm install if node_modules was not found in cache
    - *npm_install
    - echo "run unit tests"; date
    - npm run test:ci
    - echo 'end of unit tests'; date
  artifacts:
    name: unit-test-results
    when: always
    reports:
      junit: junit.xml
    expire_in: 2 weeks
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'