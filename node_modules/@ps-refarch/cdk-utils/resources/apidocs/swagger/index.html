<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" /> <!-- PowerSchool addition -->
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui.css" />
    <link rel="stylesheet" type="text/css" href="index.css" />
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
  </head>

  <body>
    <div id="swagger-ui"></div>
    <script src="./spec.js" charset="UTF-8"></script>
    <script src="./swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="./swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script src="./swagger-initializer.js" charset="UTF-8"></script>
    <script>
      window.onload = function () {
        const ui = SwaggerUIBundle({
          spec: spec,
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: 'StandaloneLayout'
        });
        window.ui = ui;
        // Add Get User OAuth Token Button.
        const auth0Btn = document.createElement('button');
        auth0Btn.innerHTML = 'Get User OAuth Token';
        auth0Btn.className = 'btn';
        auth0Btn.style = 'float: right; margin-right: 10px;';
        auth0Btn.onclick = function () {
          window.open('auth0redirect.html', '_blank');
        };
        const swaggerUI = document.querySelector('div.swagger-ui');
        swaggerUI.prepend(auth0Btn);
      };
    </script>
  </body>
</html>
