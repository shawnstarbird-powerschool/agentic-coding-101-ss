<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Swagger UI: Auth0</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui.css" />
    <link rel="stylesheet" type="text/css" href="index.css" />
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
    <script src="https://cdn.auth0.com/js/auth0-spa-js/1.12/auth0-spa-js.production.js"></script>
    <style>
      .tooltip {
        position: relative;
        display: inline-block;
      }

      .tooltip .tooltiptext {
        visibility: hidden;
        width: 140px;
        background-color: #555;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 5px;
        position: absolute;
        z-index: 1;
        bottom: 150%;
        left: 50%;
        margin-left: -75px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .tooltip .tooltiptext::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border-width: 5px;
        border-style: solid;
        border-color: #555 transparent transparent transparent;
      }

      .tooltip:hover .tooltiptext {
        visibility: visible;
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div id="swagger-ui" style="margin: 50px">
      <label for="token">OAuth Access Token</label>
      <div>
        <textarea id="token" style="width: 400px; height: 100px" readonly="readonly"></textarea>
        <div class="tooltip">
          <button id="copy-token" class="btn">
            <span class="tooltiptext" id="token-tooltip">Copy to clipboard</span>
            Copy
          </button>
        </div>
      </div>
      <label for="profile">OAuth User Profile</label>
      <div>
        <textarea id="profile" style="width: 400px; height: 100px" readonly="readonly"></textarea>
        <div class="tooltip">
          <button id="copy-profile" class="btn">
            <span class="tooltiptext" id="profile-tooltip">Copy to clipboard</span>
            Copy
          </button>
        </div>
      </div>
      <button id="login" class="btn">Click to Login</button>
    </div>

    <script>
      const config = {
        'https://apidocs.api.dev.services.powerschoolcorp.com/auth0redirect.html': {
          id: 'FjIVprDOev9maIyMGHaivdOygnPS681p',
          domain: 'powerschool-dev.powerschool-dev.auth0.com'
        },
        'https://apidocs.api.test.services.powerschoolcorp.com/auth0redirect.html': {
          id: 'p8vN61GN3GRoCxGPryRFCX8p3vDjwHt7',
          domain: 'powerschool-int.powerschool-dev.auth0.com'
        },
        'https://apidocs.api.staging.services.powerschoolcorp.com/auth0redirect.html': {
          id: '1oENWzOSgTTkvDOLq70s02RrKnU8zinp',
          domain: 'powerschool-stgus.powerschool.auth0app.com'
        }
      };
      const loc = window.location;
      const redirectUri = `${loc.protocol}//${loc.hostname}${loc.pathname}`;
      const configuration = config[redirectUri];
      const auth0 = new Auth0Client({
        domain: configuration.domain,
        client_id: configuration.id,
        redirect_uri: redirectUri
      });
      // Auth0 Events
      document.getElementById('login').addEventListener('click', async () => {
        // Displays the login.
        await auth0.loginWithRedirect();
      });
      window.addEventListener('load', async () => {
        // This function handles parsing of the redirect from Auth0.
        const redirectResult = await auth0.handleRedirectCallback();
        //logged in. you can get the user profile like this:
        const user = await auth0.getUser();
        const accessToken = await auth0.getTokenSilently();
        document.getElementById('token').value = accessToken;
        document.getElementById('profile').value = JSON.stringify(user);
      });
      // Button Events.
      document.getElementById('copy-token').addEventListener('click', () => {
        const textArea = document.getElementById('token');
        textArea.select();
        const token = textArea.value;
        navigator.clipboard.writeText(token);
        const toolTip = document.getElementById('token-tooltip');
        toolTip.innerHTML = `Copied: ${token}`;
      });
      document.getElementById('copy-token').addEventListener('onmouseout', () => {
        const toolTip = document.getElementById('token-tooltip');
        toolTip.innerHTML = `Copy to clipboard`;
      });
      document.getElementById('copy-profile').addEventListener('click', () => {
        const textArea = document.getElementById('profile');
        textArea.select();
        const token = textArea.value;
        navigator.clipboard.writeText(token);
        const toolTip = document.getElementById('profile-tooltip');
        toolTip.innerHTML = `Copied: ${token}`;
      });
      document.getElementById('copy-profile').addEventListener('onmouseout', () => {
        const toolTip = document.getElementById('profile-tooltip');
        toolTip.innerHTML = `Copy to clipboard`;
      });
    </script>
  </body>
</html>
